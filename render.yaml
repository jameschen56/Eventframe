services:
  - type: web
    name: eventframe
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm run db:migrate --prefix backend && npm run db:seed:all --prefix backend && node backend/bin/www
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: eventframe-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "604800"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        value: eventframe

databases:
  - name: eventframe-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: eventframe
    user: eventframe
    ipAllowList: []
