services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventframe
      POSTGRES_PASSWORD: eventframe_local
      POSTGRES_DB: eventframe_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventframe -d eventframe_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eventframe-postgres:/var/lib/postgresql/data

volumes:
  eventframe-postgres:
